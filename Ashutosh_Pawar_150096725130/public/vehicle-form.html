<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Form</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="app.js"></script>
  </head>
  <body>
    <h1 id="heading">Add Vehicle</h1>

    <div>
      <label for="brand">Brand : </label>
      <input type="text" id="brand" />
    </div>

    <div>
      <label for="model">Model : </label>
      <input type="text" id="model" />
    </div>

    <div>
      <label for="year">Year : </label>
      <input type="number" id="year" min="1990" max="2100" />
    </div>

    <div>
      <label for="category">Category : </label>
      <select id="category">
        <option value="Sedan">Sedan</option>
        <option value="SUV">SUV</option>
        <option value="Luxury">Luxury</option>
        <option value="Hatchback">Hatchback</option>
        <option value="Electric">Electric</option>
      </select>
    </div>

    <div>
      <label for="daily_rate">Daily Rate : </label>
      <input type="number" id="daily_rate" min="1" step="0.01" />
    </div>

    <div>
      <label for="fuel_type">Fuel Type : </label>
      <input type="text" id="fuel_type" placeholder="e.g. Petrol, Diesel, EV" />
    </div>

    <div>
      <label for="seating_capacity">Seats : </label>
      <input type="number" id="seating_capacity" min="1" max="15" value="5" />
    </div>

    <div>
      <label for="status">Status : </label>
      <select id="status">
        <option value="available">Available</option>
        <option value="maintenance">Maintenance</option>
      </select>
    </div>

    <br />

    <div>
      <button onclick="handleSubmit()">Save</button>
      <button onclick="location.href = 'index.html'">Back</button>
    </div>

    <script>
      const vehicleId = new URLSearchParams(location.search).get("id");
      const fields = ["brand", "model", "year", "category", "daily_rate", "fuel_type", "seating_capacity"];
      let currentStatus = "available";

      function loadVehicle() {
        callApi(`/vehicles/${vehicleId}`)
          .then(({ response, data }) => {
            if (response.status !== 200) {
              showError(data.message || "could not load vehicle!");
              return;
            }
            fields.forEach((field) => {
              document.getElementById(field).value = data.vehicle[field];
            });
            currentStatus = data.vehicle.status;
            if (currentStatus === "rented") {
              document.getElementById("status").disabled = true;
            } else {
              document.getElementById("status").value = currentStatus;
            }
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      function handleSubmit() {
        const body = {
          brand: document.getElementById("brand").value,
          model: document.getElementById("model").value,
          year: Number(document.getElementById("year").value),
          category: document.getElementById("category").value,
          daily_rate: Number(document.getElementById("daily_rate").value),
          fuel_type: document.getElementById("fuel_type").value,
          seating_capacity: Number(document.getElementById("seating_capacity").value),
        };
        if (currentStatus !== "rented") {
          body.status = document.getElementById("status").value;
        }

        const path = vehicleId ? `/vehicles/${vehicleId}` : "/vehicles";
        const method = vehicleId ? "PUT" : "POST";

        callApi(path, method, body)
          .then(({ response, data }) => {
            console.log(data);
            if (handleUnauthorized(response, data)) return;

            if (response.status === 200 || response.status === 201) {
              showSuccess(vehicleId ? "vehicle updated" : "vehicle added").then(() => {
                location.href = "index.html";
              });
            } else {
              showError(data.message || "Something went wrong!");
            }
          })
          .catch((error) => {
            console.log(error);
            showError("could not reach the server!");
          });
      }

      if (requireRole("admin") && vehicleId) {
        document.getElementById("heading").textContent = "Edit Vehicle";
        loadVehicle();
      }
    </script>
  </body>
</html>
